version: '3.8'

services:
  # API service
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=tour_leader
      - DB_PASSWORD=password
      - DB_NAME=tour_leader
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=your-super-secret-development-key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - tour-leader-network
    volumes:
      - ./static:/static

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=tour_leader
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=tour_leader
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - tour-leader-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tour_leader -d tour_leader"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tour-leader-network
    command: redis-server --appendonly yes

  # PostgreSQL Admin (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@tourleader.app
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - tour-leader-network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # Redis Admin (optional)
  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - tour-leader-network

networks:
  tour-leader-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
